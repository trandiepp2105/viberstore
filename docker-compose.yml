services:
  viberstore_nginx:
    image: nginx:1.25-alpine
    container_name: viberstore_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/media:/var/www/media:ro
      - ./backend/static:/var/www/static:ro
    depends_on:
      - viberstore_frontend
      - viberstore_admin
      - viberstore_backend
    restart: unless-stopped
    networks:
      - localnet

  # Frontend service
  viberstore_frontend:
    container_name: viberstore_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - localnet

  # Admin service
  viberstore_admin:
    container_name: viberstore_admin
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        PUBLIC_URL: /dashboard
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - localnet

  # Backend service
  viberstore_backend:
    container_name: viberstore_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/backend
    expose:
      - "8000"
    depends_on:
      viberstore_mysql:
        condition: service_healthy
    env_file:
      - ./.env
    networks:
      - localnet
    stdin_open: true
    tty: true

  # Elasticsearch service (disabled)
  # elasticsearch:
  #   container_name: elasticsearch
  #   image: elasticsearch:8.0.0
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - ES_JAVA_OPTS=-Xms512m -Xmx512m
  #     - bootstrap.memory_lock=true
  #   env_file:
  #     - ./.env
  #   ports:
  #     - "9200:9200"
  #   volumes:
  #     - elasticsearch-data:/usr/share/elasticsearch/data
  #   restart: unless-stopped
  #   ulimits:
  #     memlock:
  #       soft: -1
  #       hard: -1
  #   mem_limit: 1g
  #   networks:
  #     - localnet

  viberstore_mysql:
    image: mysql:8.0
    container_name: viberstore_mysql
    ports:
      - "3309:3309"
    env_file:
      - ./.env
    volumes:
      - viberstore-mysql:/var/lib/mysql
      - ./initial_data:/docker-entrypoint-initdb.d
      - ./mysql_custom_conf:/etc/mysql/conf.d
    restart: always
    command:
      - --port=3309
    # command:
    #   [
    #     "/bin/bash",
    #     "-c",
    #     "chmod +x /docker-entrypoint-initdb.d/99_create_import_done_flag.sh && exec mysqld --port=3309",
    #   ]

    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/mysql/initial_data_imported.flag"]
      interval: 5s
      timeout: 2s
      retries: 72
      start_period: 15s
    networks:
      - localnet

  # Redis service
  viberstore_redis:
    container_name: viberstore_redis
    image: redis:latest
    expose:
      - "6379"
    entrypoint: [
        "sh",
        "-c",
        "mkdir -p /usr/local/etc/redis && \
        echo 'bind 0.0.0.0\nport 6379\nmaxmemory-policy noeviction' > /usr/local/etc/redis/redis.conf && \
        redis-server /usr/local/etc/redis/redis.conf",
      ]
    restart: "always"
    volumes:
      - redis-data:/data
    networks:
      - localnet

volumes:
  viberstore-mysql:
  redis-data:

networks:
  localnet:
    driver: bridge
